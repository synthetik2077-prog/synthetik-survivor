name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java (needed by Android's build tool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install project dependencies
        run: npm install

      - name: Add the Android platform
        run: npx cap add android

      - name: Sync the game files into the Android project
        run: npx cap sync android

      - name: Build the debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload the APK so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: synthetik-survivor-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
